  <atom type="CommandHelp">
    <hash type="Command" key="poly.smartInset@en_US">
      <atom type="UserName">Smart Inset</atom>
      <atom type="ButtonName">Smart Inset</atom>
      <atom type="Desc">Inset selected polygons using collision-safe straight skeleton or padding offset algorithm.</atom>
      <hash type="Argument" key="mode">
        <atom type="UserName">Mode</atom>
        <atom type="Desc">Algorithm mode (Smart Inset or Padding Inset).</atom>
        <atom type="ArgumentType">inset_mode</atom>
      </hash>
      <hash type="Argument" key="size">
        <atom type="UserName">Size</atom>
        <atom type="Desc">Inset distance.</atom>
      </hash>
      <hash type="Argument" key="threshold">
        <atom type="UserName">Threshold</atom>
        <atom type="Desc">Collision limit checking threshold (Smart Inset).</atom>
      </hash>
      <hash type="Argument" key="merge">
        <atom type="UserName">Merge</atom>
        <atom type="Desc">Merge close vertices of the result (Smart Inset).</atom>
      </hash>
      <hash type="Argument" key="mergeDist">
        <atom type="UserName">Merge Distance</atom>
        <atom type="Desc">Merge distance threshold (Smart Inset).</atom>
      </hash>
      <hash type="Argument" key="flat">
        <atom type="UserName">Flat Concave</atom>
        <atom type="Desc">Flat concave offset (Padding Inset).</atom>
      </hash>
      <hash type="Argument" key="align">
        <atom type="UserName">Alignment</atom>
        <atom type="Desc">Ray alignment angle for inside checking (Padding Inset).</atom>
      </hash>
      <hash type="Argument" key="connect">
        <atom type="UserName">Connect</atom>
        <atom type="Desc">Connect with original boundary edges with side skirts (Padding Inset).</atom>
      </hash>
    </hash>
    <hash type="ArgumentType" key="inset_mode@en_US">
      <hash type="Option" key="safe">
        <atom type="UserName">Smart Inset</atom>
        <atom type="Desc">Straight skeleton collision-safe inset.</atom>
      </hash>
      <hash type="Option" key="padding">
        <atom type="UserName">Padding Inset</atom>
        <atom type="Desc">Parallel edge-offset with self-intersection decomposition.</atom>
      </hash>
    </hash>
